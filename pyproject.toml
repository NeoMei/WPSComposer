[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wps-composer"
version = "0.7.2"
description = "WPS-backed rich document composition for AI agents (Windows COM + macOS JSAPI)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["wps", "office", "document", "pdf", "docx", "markdown", "excalidraw", "latex", "math"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.optional-dependencies]
windows = ["pywin32>=306; platform_system == 'Windows'"]
pdf = ["pypdf>=4", "pdfplumber>=0.11", "reportlab>=4"]
math = ["matplotlib>=3.5"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["skills*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
